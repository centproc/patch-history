name: Append Website Patch Notes on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-website-patchnotes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show layout (debug)
        run: |
          pwd
          ls -al
          ls -al patch-history-app || true
          ls -al patch-history-app/patch-history-app || true

      - name: Build entry from PR body (checkboxes) and labels
        id: build_entry
        shell: bash
        env:
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL:    ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY:   ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
        run: |
          set -euo pipefail

          FILE="patch-history-app/patch-history-app/wwwroot/docs/website-patchnotes.md"
          mkdir -p "$(dirname "$FILE")"
          touch "$FILE"

          DATE=$(date -u +"%Y-%m-%d")
          TITLE="${PR_TITLE}"
          NUMBER="${PR_NUMBER}"
          URL="${PR_URL}"
          AUTHOR="${PR_AUTHOR}"
          BODY="${PR_BODY:-}"
          LABELS="${PR_LABELS:-}"

          # Checked categories from PR body lines like: "- [x] ui"
          mapfile -t CAT_LINES < <(printf '%s\n' "$BODY" | grep -Ei '^\s*-\s*\[[xX]\]\s*.+') || true
          CATS_FROM_BODY=""
          if (( ${#CAT_LINES[@]} > 0 )); then
            CATS_FROM_BODY=$(printf '%s\n' "${CAT_LINES[@]}" \
              | sed -E 's/^\s*-\s*\[[xX]\]\s*//g' \
              | paste -sd',' - \
              | sed 's/,/, /g')
          fi

          if [ -n "$CATS_FROM_BODY" ] && [ -n "$LABELS" ]; then
            CATEGORY="$CATS_FROM_BODY, $LABELS"
          elif [ -n "$CATS_FROM_BODY" ]; then
            CATEGORY="$CATS_FROM_BODY"
          else
            CATEGORY="$LABELS"
          fi

          ENTRY="$(cat << 'EOF'
          ### ${DATE} — PR #${NUMBER}: ${TITLE}

          <table class="custom-table">
            <thead>
              <tr><th>Changes</th><th>Category</th><th>Adjustment Details</th></tr>
            </thead>
            <tbody>
              <tr>
                <td>PR</td>
                <td>${CATEGORY}</td>
                <td>Merged by @${AUTHOR}. See <a href="${URL}">${URL}</a>.</td>
              </tr>
            </tbody>
          </table>

          EOF
          )"
          ENTRY=$(eval "echo \"${ENTRY}\"")

          # Prepend under H1 if present; else create H1 and prepend
          if head -n1 "$FILE" | grep -qE '^# '; then
            awk -v entry="$ENTRY" '
              NR==1 && $0 ~ /^# / { print; print ""; print entry; next }
              { print }
            ' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          else
            {
              echo "# Website Patch Notes"
              echo
              echo "$ENTRY"
              cat "$FILE"
            } > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update website-patchnotes with PR #${{ github.event.pull_request.number }}"
          file_pattern: patch-history-app/patch-history-app/wwwroot/docs/website-patchnotes.md
          branch: main
          token: ${{ secrets.PUBLISH_TOKEN }}
