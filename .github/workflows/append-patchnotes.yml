name: Append Website Patch Notes on PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  update-website-patchnotes:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show layout (debug)
        run: |
          pwd
          ls -al
          ls -al patch-history-app || true
          ls -al patch-history-app/patch-history-app || true

      - name: Build entry from PR body (checkboxes) and labels
        id: build_entry
        shell: bash
        env:
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL:    ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BODY:   ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
        run: |
          set -euo pipefail

          FILE="patch-history-app/patch-history-app/wwwroot/docs/website-patchnotes.md"
          mkdir -p "$(dirname "$FILE")"
          touch "$FILE"

          DATE=$(date -u +"%Y-%m-%d")
          TITLE="${PR_TITLE}"
          NUMBER="${PR_NUMBER}"
          URL="${PR_URL}"
          AUTHOR="${PR_AUTHOR}"
          BODY="${PR_BODY:-}"
          LABELS="${PR_LABELS:-}"

          # -------- helpers --------
          esc_html() {
            # Minimal HTML escaping: &, <, >
            printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }
          nl2br() {
            # Normalize CRLF, then convert newlines to <br>
            sed -e 's/\r//g' -e ':a;N;$!ba;s/\n/<br>/g'
          }
          extract_section() {
            # $1 = heading (e.g., "Summary" or "Details")
            # Grab text from "### Heading" up to next "### " or end
            awk -v H="### $1" '
              BEGIN{found=0}
              $0 ~ "^"H"[[:space:]]*$" {found=1; next}
              found && $0 ~ "^### " {found=0}
              found {print}
            '
          }

          # -------- categories (checkbox + labels) --------
          mapfile -t CAT_LINES < <(printf '%s\n' "$BODY" | grep -Ei '^\s*-\s*\[[xX]\]\s*.+') || true
          CATS_FROM_BODY=""
          if (( ${#CAT_LINES[@]} > 0 )); then
            CATS_FROM_BODY=$(printf '%s\n' "${CAT_LINES[@]}" \
              | sed -E 's/^\s*-\s*\[[xX]\]\s*//g' \
              | paste -sd',' - \
              | sed 's/,/, /g')
          fi
          if [ -n "$CATS_FROM_BODY" ] && [ -n "$LABELS" ]; then
            CATEGORY="$CATS_FROM_BODY, $LABELS"
          elif [ -n "$CATS_FROM_BODY" ]; then
            CATEGORY="$CATS_FROM_BODY"
          else
            CATEGORY="$LABELS"
          fi

          # -------- extract Summary / Details from PR body --------
          RAW_SUMMARY="$(printf '%s' "$BODY" | extract_section "Summary" || true)"
          RAW_DETAILS="$(printf '%s' "$BODY" | extract_section "Details" || true)"

          # Fallbacks if author didn’t fill sections
          if [ -z "${RAW_SUMMARY// }" ]; then
            # Use first 300 chars of body as a summary fallback
            RAW_SUMMARY="$(printf '%s' "$BODY" | head -c 300)"
          fi
          [ -z "${RAW_DETAILS// }" ] && RAW_DETAILS="(No additional details provided.)"

          SAFE_SUMMARY="$(esc_html "$RAW_SUMMARY" | nl2br)"
          SAFE_DETAILS="$(esc_html "$RAW_DETAILS" | nl2br)"
          SAFE_CATEGORY="$(esc_html "$CATEGORY")"

          # -------- build card --------
          ENTRY="$(cat << 'EOF'
          <div class="patch-note-card">
            <div class="patch-note-header">
              <span class="patch-note-date">${DATE}</span>
              <span class="patch-note-pr">PR #${NUMBER}</span>
            </div>
            <h4 class="patch-note-title">${TITLE}</h4>
            <div class="patch-note-meta"><strong>Category:</strong> ${SAFE_CATEGORY}</div>
            <div class="patch-note-section">
              <h5>Summary</h5>
              <div class="patch-note-text">${SAFE_SUMMARY}</div>
            </div>
            <div class="patch-note-section">
              <h5>Details</h5>
              <div class="patch-note-text">${SAFE_DETAILS}</div>
            </div>
            <div class="patch-note-details">
              Merged by @${AUTHOR}. See <a href="${URL}">${URL}</a>.
            </div>
          </div>

          EOF
          )"
          ENTRY=$(eval "echo \"${ENTRY}\"")

          # -------- prepend under H1, or create H1 then prepend --------
          if head -n1 "$FILE" | grep -qE '^# '; then
            awk -v entry="$ENTRY" '
              NR==1 && $0 ~ /^# / { print; print ""; print entry; next }
              { print }
            ' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          else
            {
              echo "# Website Patch Notes"
              echo
              echo "$ENTRY"
              cat "$FILE"
            } > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update website-patchnotes with PR #${{ github.event.pull_request.number }}"
          file_pattern: patch-history-app/patch-history-app/wwwroot/docs/website-patchnotes.md
          branch: main
          token: ${{ secrets.PUBLISH_TOKEN }}
